name: Probe History
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe 2024/2025 history
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python scripts/probe_history.py
      - name: Commit and push probe result
        run: |
          git config user.name "ff-analytics bot"
          git config user.email "actions@github.com"
          git add docs/data/probe_espn_proj.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "probe: espn projection dump"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
